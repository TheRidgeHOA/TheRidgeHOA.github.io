# ---------------------------------------------------------------------------
# Fees & Dues figures.
#
# This file holds the dollar amounts and dates shown on the Fees & Dues page
# (fees.html) in ONE place so they are easy to update when the Board sets new
# figures. Edit the values between the quotes, save, and the site rebuilds.
#
# Keep the keys exactly as named - fees.html looks them up by name.
#
# NOTE: The recorded governing documents control in the event of any
# discrepancy. Keep these figures in step with the Declaration of Covenants
# and any Board resolutions.
# ---------------------------------------------------------------------------

# --- Annual dues -----------------------------------------------------------
# The yearly assessment charged to each lot.
#   annual_dues_amount    - the dollar figure (include the "$")
#   annual_dues_per       - the unit the amount applies to
#   dues_due_date         - the date dues are due each year
#   dues_delinquent_date  - the date an unpaid account becomes delinquent
annual_dues_amount:   "$600.00"
annual_dues_per:      "lot, per year"
dues_due_date:        "January 1, 2026"
dues_delinquent_date: "February 1, 2026"

# --- Administrative fee on delinquent accounts -----------------------------
# A fee that reimburses the Association for the costs it incurs in attempting
# to collect a delinquent account. It is NOT a punitive penalty. It accrues
# on the first day of each month an account remains delinquent.
#   admin_fee_amount - the dollar figure (include the "$")
#   admin_fee_per    - the period over which the fee recurs
admin_fee_amount: "$10.00"
admin_fee_per:    "month"

# --- Ownership transfer fee ------------------------------------------------
# A one-time fee charged when ownership of a lot is transferred.
#   transfer_fee_amount - the dollar figure (include the "$")
transfer_fee_amount: "$350.00"
