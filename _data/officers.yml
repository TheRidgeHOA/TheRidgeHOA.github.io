# ---------------------------------------------------------------------------
# HOA officers and board members.
#
# Each entry supports:
#   name  - person's full name (required)
#   role  - their title / role description (required)
#   email_user   - OPTIONAL: the part of an email address before the "@"
#   email_domain - OPTIONAL: the part of an email address after the "@"
#
# When BOTH email_user and email_domain are present, the officers page
# renders a "click to reveal email" button. The address is never written
# into the page HTML as plain text; JavaScript assembles the mailto link
# only when the visitor clicks. This keeps addresses away from spam
# scrapers. To add an email for an officer, just fill in both fields.
# ---------------------------------------------------------------------------

