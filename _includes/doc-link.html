{%- comment -%}
  Reusable PDF document link.
  Usage:  {% include doc-link.html title="..." file="/assets/documents/x.pdf" %}
  Opens the PDF in a new tab. The file path is run through relative_url.
{%- endcomment -%}
<a class="doc-link"
   href="{{ include.file | relative_url }}"
   target="_blank"
   rel="noopener noreferrer">
  <svg class="doc-link__icon" width="22" height="22" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <polyline points="14 2 14 8 20 8"></polyline>
    <line x1="9" y1="13" x2="15" y2="13"></line>
    <line x1="9" y1="17" x2="15" y2="17"></line>
  </svg>
  <span class="doc-link__title">{{ include.title }}</span>
  <span class="doc-link__meta" aria-hidden="true">PDF</span>
</a>
